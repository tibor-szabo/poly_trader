app:
  mode: paper # paper|live
  loop_seconds: 1
  event_driven: true
  min_cycle_seconds: 0.2

data:
  clob_rest_base: "https://clob.polymarket.com"
  gamma_base: "https://gamma-api.polymarket.com"
  use_clob_ws: true
  stale_seconds: 30
  max_markets: 24
  btc_group_size: 3
  alt_group_size: 0
  alt_group_refresh_seconds: 300
  alt_group_horizon_days: 30
  alt_group_topic_cap: 3
  alt_vol_window_seconds: 600
  alt_min_updates_per_min: 3
  alt_vol_weight: 0.60
  alt_max_spread_sum: 0.12
  btc_live_poll_ms: 300
  focus_keywords:
    - "BTC"
    - "Bitcoin"
    - "15 min"
    - "15-minute"
    - "Up or Down"
  focus_slugs: []
  focus_slug_prefixes:
    - "btc-updown-15m-"
    - "btc-updown-5m-"

scoring:
  min_edge_bps: 20
  slippage_bps: 25
  fee_bps: 10
  target_size_usd: 20

execution:
  max_exec_sum: 1.02
  open_mode: "market" # limit_first|market
  open_limit_improve_ticks: 1
  open_limit_fallback_taker: true
  close_mode: "limit_first" # limit_first|market
  close_limit_improve_ticks: 1
  close_limit_timeout_s: 20
  close_limit_reprice_s: 4
  close_force_taker_reasons: ["hard_stop_25", "resolved_loss_proxy", "flip_stop"]
  tick_size: 0.001

risk:
  max_notional_per_market_usd: 100
  max_daily_loss_usd: 50
  max_open_markets: 5

paper:
  starting_cash_usd: 100
  simulated_latency_ms: 300

strategy:
  impulse_source: "binance"  # binance|coinbase|kraken|bybit
  probability_engine: "binance_ta_v1"  # hybrid|binance_ta_v1
  trade_cap_usd: 100
  max_trade_cash_fraction: 0.035
  max_open_positions: 2
  base_reentry_cooldown_s: 240
  flip_reentry_cooldown_s: 600
  min_hold_for_flip_exit_s: 90
  min_hold_for_flip_stop_s: 45
  min_time_left_for_entry_s: 75
  flip_signal_conf_min: 68
  flip_stop_loss_pct: -0.06
  buy_no_flip_stop_loss_pct: -0.10
  flip_stop_loss_lock_seconds: 900
  global_flip_stop_pause_seconds: 180
  global_flip_stop_window_seconds: 1200
  global_flip_stop_trigger_count: 1
  buy_yes_conf_floor: 72
  buy_yes_consensus_floor: 2
  buy_yes_reentry_cooldown_mult: 1.9
  buy_no_conf_floor: 74
  buy_no_consensus_floor: 2
  buy_no_reentry_cooldown_mult: 2.1
  scalp_min_impulse_bps: 9.0
  scalp_buy_yes_min_impulse_bps: 15.0
  scalp_buy_no_min_impulse_bps: 12.0
  scalp_min_edge: 0.018
  open_fallback_max_spread: 0.016
  open_fallback_min_edge: 0.06
  open_fallback_min_confidence: 88
  open_fallback_min_time_left_s: 120
  open_fallback_size_mult: 0.60
  buy_no_size_mult: 0.70
  global_hard_stop_pause_seconds: 420
  global_hard_stop_window_seconds: 1200
  global_hard_stop_trigger_count: 1
  btc_target_missing_cooldown_s: 3600
  btc_target_missing_refresh_s: 180
  btc_target_missing_recent_lines: 200000
  min_entry_price: 0.04
  max_entry_price: 0.96
  normal_min_edge: 0.02
  reversal_min_edge: 0.035
  hard_stop_pct: -0.045
  tf_divergence_min: 0.12
  tf_divergence_fee_buffer: 0.02
  normal_open_min_winner_stability: 0.22
  normal_open_buy_yes_min_winner_stability: 0.35
  model_side_stability_window: 8
  model_side_stability_min: 0.55
  model_side_stability_buy_yes_min: 0.65
  normal_open_max_opposing_impulse_bps: 2.0
  exploration_enabled: true
  exploration_idle_seconds: 1800
  exploration_min_confidence: 55
  exploration_min_time_left_s: 120
  exploration_edge_floor: 0.012
  exploration_size_mult: 0.35

storage:
  state_path: "data/state.json"
  events_path: "data/events.jsonl"


live:
  enabled: false
  dry_run: true
  clob_host: "https://clob.polymarket.com"
  chain_id: 137
  signature_type: 1
  order_type: "GTC"
